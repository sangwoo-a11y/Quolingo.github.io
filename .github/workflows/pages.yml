name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/vendor
          cp index.html style.css app.js pwa.js sw.js manifest.webmanifest chapters.js old-testament.js new-testament.js progress.js sharing.js customization.js cloud.js supabase-config.js THIRD_PARTY_NOTICES.md _site/
          cp assets/*.png _site/assets/
          cp vendor/supabase-2.118.0.js vendor/SUPABASE-LICENSE _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
